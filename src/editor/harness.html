<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideDiff engine harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd; font: 12px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; align-items: center; }
      #bar button, #bar label { font: inherit; }
      #editor { flex: 1; min-height: 0; }
      #log { height: 120px; overflow: auto; margin: 0; padding: 4px; background: #111; font: 11px monospace; white-space: pre-wrap; }
      #spinner { width: 12px; height: 12px; border: 2px solid #888; border-top-color: transparent; border-radius: 50%; visibility: hidden; animation: spin 0.8s linear infinite; }
      #spinner.on { visibility: visible; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="bar">
      <button data-gen="2000">gen 2k</button>
      <button data-gen="30000">gen 30k</button>
      <button data-gen="150000">gen 150k</button>
      <button data-gen="500000">gen 500k</button>
      <select id="fixture"><option value="">fixture…</option></select>
      <button id="prev">prev</button>
      <button id="next">next</button>
      <span id="pos">-</span>
      <label><input type="checkbox" id="diffOnly" /> diff only</label>
      <input type="number" id="ctx" value="3" min="0" max="20" style="width: 3em" />
      <label><input type="checkbox" id="trim" checked /> trim ws</label>
      <label><input type="checkbox" id="allws" /> all ws</label>
      <label><input type="checkbox" id="wrap" /> wrap</label>
      <label><input type="checkbox" id="minimap" checked /> minimap</label>
      <label><input type="checkbox" id="inline" /> inline</label>
      <button id="swap">swap</button>
      <button id="theme">theme</button>
      <button id="find">find</button>
      <span id="spinner"></span>
      <span id="stats"></span>
    </div>
    <div id="editor"></div>
    <pre id="log"></pre>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
